form:
  image: node:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.form
    args:
      NODE_ENV: production
  ports:
    - "8000:8000"
  environment:
    - LOG_LEVEL=WARNING
    - CACHE_TTL=60
  volumes:
    - form_data:/var/lib/data
  restart: unless-stopped


profile:
  image: node:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.profile
    args:
      NODE_ENV: production
  ports:
    - "3000:3000"
  environment:
    - LOG_LEVEL=DEBUG
    - CACHE_TTL=300
  volumes:
    - profile_data:/var/lib/data
  restart: unless-stopped
