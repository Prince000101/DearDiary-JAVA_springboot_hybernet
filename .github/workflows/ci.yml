helpers:
  image: node:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.helpers
    args:
      NODE_ENV: production
  ports:
    - "8000:8000"
  environment:
    - LOG_LEVEL=DEBUG
    - CACHE_TTL=120
  volumes:
    - helpers_data:/var/lib/data
  restart: unless-stopped


table:
  image: alpine:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.table
    args:
      NODE_ENV: production
  ports:
    - "3000:3000"
  environment:
    - LOG_LEVEL=INFO
    - CACHE_TTL=300
  volumes:
    - table_data:/var/lib/data
  restart: unless-stopped
