  build:
    context: .
    dockerfile: Dockerfile.table
    args:
      NODE_ENV: production
  ports:
    - "3000:3000"
  environment:
    - LOG_LEVEL=INFO
    - CACHE_TTL=300
  volumes:
    - table_data:/var/lib/data
  restart: unless-stopped


