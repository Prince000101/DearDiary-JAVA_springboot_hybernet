helpers:
  image: node:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.helpers
    args:
      NODE_ENV: production
  ports:
    - "8000:8000"
  environment:
    - LOG_LEVEL=DEBUG
    - CACHE_TTL=120
  volumes:
    - helpers_data:/var/lib/data
  restart: unless-stopped


