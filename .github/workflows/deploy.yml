repo:
  image: node:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.repo
    args:
      NODE_ENV: production
  ports:
    - "4000:4000"
  environment:
    - LOG_LEVEL=WARNING
    - CACHE_TTL=3600
  volumes:
    - repo_data:/var/lib/data
  restart: unless-stopped


worker:
  image: nginx:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.worker
    args:
      NODE_ENV: production
  ports:
    - "3000:3000"
  environment:
    - LOG_LEVEL=INFO
    - CACHE_TTL=600
  volumes:
    - worker_data:/var/lib/data
  restart: unless-stopped


profile:
  image: node:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.profile
    args:
      NODE_ENV: production
  ports:
    - "8000:8000"
  environment:
    - LOG_LEVEL=INFO
    - CACHE_TTL=300
  volumes:
    - profile_data:/var/lib/data
  restart: unless-stopped


register:
  image: node:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.register
    args:
      NODE_ENV: production
  ports:
    - "4000:4000"
  environment:
    - LOG_LEVEL=DEBUG
    - CACHE_TTL=120
  volumes:
    - register_data:/var/lib/data
  restart: unless-stopped


metrics:
  image: python:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.metrics
    args:
      NODE_ENV: production
  ports:
    - "8080:8080"
  environment:
    - LOG_LEVEL=INFO
    - CACHE_TTL=60
  volumes:
    - metrics_data:/var/lib/data
  restart: unless-stopped


serializer:
  image: node:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.serializer
    args:
      NODE_ENV: production
  ports:
    - "3000:3000"
  environment:
    - LOG_LEVEL=INFO
    - CACHE_TTL=300
  volumes:
    - serializer_data:/var/lib/data
  restart: unless-stopped
