repo:
  image: node:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.repo
    args:
      NODE_ENV: production
  ports:
    - "4000:4000"
  environment:
    - LOG_LEVEL=WARNING
    - CACHE_TTL=3600
  volumes:
    - repo_data:/var/lib/data
  restart: unless-stopped


worker:
  image: nginx:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.worker
    args:
      NODE_ENV: production
  ports:
    - "3000:3000"
  environment:
    - LOG_LEVEL=INFO
    - CACHE_TTL=600
  volumes:
    - worker_data:/var/lib/data
  restart: unless-stopped
