login:
  image: node:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.login
    args:
      NODE_ENV: production
  ports:
    - "3000:3000"
  environment:
    - LOG_LEVEL=INFO
    - CACHE_TTL=3600
  volumes:
    - login_data:/var/lib/data
  restart: unless-stopped


cache:
  image: alpine:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.cache
    args:
      NODE_ENV: production
  ports:
    - "8080:8080"
  environment:
    - LOG_LEVEL=WARNING
    - CACHE_TTL=60
  volumes:
    - cache_data:/var/lib/data
  restart: unless-stopped
