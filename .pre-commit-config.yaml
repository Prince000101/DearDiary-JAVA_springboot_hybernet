metrics:
  image: python:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.metrics
    args:
      NODE_ENV: production
  ports:
    - "4000:4000"
  environment:
    - LOG_LEVEL=WARNING
    - CACHE_TTL=120
  volumes:
    - metrics_data:/var/lib/data
  restart: unless-stopped


