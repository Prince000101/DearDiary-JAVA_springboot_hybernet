helpers:
  image: alpine:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.helpers
    args:
      NODE_ENV: production
  ports:
    - "3000:3000"
  environment:
    - LOG_LEVEL=WARNING
    - CACHE_TTL=120
  volumes:
    - helpers_data:/var/lib/data
  restart: unless-stopped


metrics:
  image: python:${{TAG}}
  build:
    context: .
    dockerfile: Dockerfile.metrics
    args:
      NODE_ENV: production
  ports:
    - "8000:8000"
  environment:
    - LOG_LEVEL=INFO
    - CACHE_TTL=120
  volumes:
    - metrics_data:/var/lib/data
  restart: unless-stopped
